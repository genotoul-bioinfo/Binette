[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Binette"
description = "Binette: accurate binning refinement tool to constructs high quality MAGs."
dynamic = ["version"]
authors = [
    {name = "Jean Mainguy"},
]
maintainers = [
    {name = "Jean Mainguy"},
]

readme = "README.md"
keywords = ["Bioinformatics", "Prokaryote", "Binning", "Refinement", "Metagenomics"]
classifiers=[
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"]
requires-python = ">=3.12"

dependencies = [
    "networkx>=3.0,<4.0",
    "numpy>1.24,<3.0",
    "pandas>=2,<3",
    "pyfastx>=2,<3",
    "pyrodigal>=3,<4",
    "pyroaring>=1.0.0,<2.0.0",
    "scipy>=1.8,<2",
    "typer>=0.9.0,<1.0.0",
    "rich>=12.0.0,<16.0.0"
]

[project.optional-dependencies]

doc = [
    "sphinx==6.2.1",
    "sphinx_rtd_theme==1.2.2",
    "readthedocs-sphinx-search==0.3.1",
    "sphinx-autobuild==2021.3.14",
    "myst-parser==1.0.0",
    "docutils==0.18.1", #"myst-nb",
    "nbsphinx==0.9.5",
    "nbsphinx_link==1.3.0",
    "sphinx-book-theme==1.0.1",
    "sphinxcontrib.mermaid",
    "sphinx_togglebutton==0.3.2"
     ]

dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "ruff==0.13.3",  # same version as in .pre-commit-config.yaml
    "pyright==1.1.414",
    "pandas-stubs>=2,<3",
    "prek",
]
#
[project.urls]
Repository = "https://github.com/genotoul-bioinfo/Binette"
#Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"
Documentation = "https://binette.readthedocs.io"
#
#
[project.scripts]
binette = "binette.main:main"

[tool.setuptools]
packages = ["binette"]


[tool.setuptools.dynamic]
version = {attr = "binette.__version__"}

[tool.ruff]
line-length = 88
target-version = "py312"

lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]

lint.ignore = [
    "E501",   # line length is handled by the formatter
    "E203",   # whitespace before ':' (conflicts with formatter)
    "RUF005", # allow list concatenation (`a + [b]`)
    "PT011",  # allow `pytest.raises(ValueError)` without `match=`
]

[tool.ruff.lint.isort]
known-first-party = ["binette"]

[tool.pyright]
include = ["binette"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
markers = [
    "requires_test_data: marks tests that require test dataset path to be provided",
]
