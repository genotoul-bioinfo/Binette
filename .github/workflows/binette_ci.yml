# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  pull_request:
    branches: 
      - '*'
  # Runs on main after a merge, to publish the coverage report
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    
jobs:
  build:
    permissions:
      contents: write  # push the coverage report to the gh-pages branch
    defaults:
      run:
        shell: bash -el {0}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 (ubuntu-latest since Nov 2026) has glibc 2.43, which refuses to load
        # the conda-forge tensorflow <2.20 needed by checkm2 (executable stack).
        # Go back to ubuntu-latest once checkm2 accepts a tensorflow build without it.
        # See https://github.com/conda-forge/tensorflow-feedstock/issues/455
        os: ['ubuntu-24.04', 'macos-latest']
        python-version: ['3.12']  # checkm2 1.1 needs tensorflow <2.20, not built for python 3.13

    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v7

    - name : Setup miniconda environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,bioconda
        environment-file: binette.yaml
        activate-environment: binette
        conda-remove-defaults: "true"

    - name: Install binette
      shell: bash -l {0}
      run: |
        pip install ".[dev]"
        binette -h

    - name: Type check with pyright
      shell: bash -l {0}
      run: pyright

    - name: Download test data
      uses: actions/checkout@v7
      with:
        repository: genotoul-bioinfo/Binette_TestData
        path: test_data

    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pytest --cov=binette --cov-report=html --cov-report=xml --cov-report=term  -v  --test-data-path="test_data/"

    - name: Generate coverage badge
      shell: bash -l {0}
      run: |
        pip install genbadge[coverage]
        genbadge coverage -i coverage.xml  -o htmlcov/coverage-badge.svg
        rm htmlcov/.gitignore

    - name: Publish coverage report to GitHub Pages
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.os == 'ubuntu-24.04'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: htmlcov
        branch: gh-pages
        
    - name: Run simple test case from bin2table
      shell: bash -l {0}
      run: |
        cd test_data
        binette -b binning_results/*binning --contigs all_contigs.fna --checkm2_db checkm2_tiny_db/checkm2_tiny_db.dmnd  -v -o test_results

    - name: Compare results from bin2table with expectation
      shell: bash -l {0}
      run: |
        cd test_data
        head  ../tests/expected_results/final_bins_quality_reports.tsv test_results/final_bins_quality_reports.tsv
        python scripts/compare_results.py ../tests/expected_results/final_bins_quality_reports.tsv test_results/final_bins_quality_reports.tsv


